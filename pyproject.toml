[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsi"
version = "0.1.0"
description = "Agent-ready scaffolding for Algorithm Design & Analysis projects: catalog, starters, measuring, experiments, plots, reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Void" }]
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vsi = "vsi.cli:main"

[tool.setuptools]
packages = ["vsi"]
include-package-data = true

[tool.setuptools.package-data]
vsi = ["AGENTS.md", "projects/**/*", "starters/**/*", "starters/**/.gitignore", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
